name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            qt-version: 6.11.2

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            qt-version: 6.11.2

          - os: windows-2022
            artifact-name: Windows-MinGW-w64
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-version: 6.11.2

          - os: windows-2022
            artifact-name: Windows-MSVC
            # TODO(@getchoo): This is the default in setup-dependencies/windows. Why isn't it working?!?!
            vcvars-arch: amd64
            qt-version: 6.11.2

          - os: windows-11-arm
            artifact-name: Windows-MSVC-arm64
            vcvars-arch: arm64
            qt-version: 6.11.2

          - os: macos-26
            artifact-name: macOS
            macosx-deployment-target: 13.0
            qt-version: 6.11.2

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ci

      CMAKE_OSX_ARCHITECTURES: x86_64;arm64
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" -D Launcher_APP_BINARY_NAME="${{ runner.os == 'Windows' && 'ZyronClient' || 'prismlauncher' }}"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage and smoke-test Zyron x64 release
        if: ${{ runner.os == 'Windows' && matrix.artifact-name == 'Windows-MSVC' && env.BUILD_TYPE == 'Release' }}
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          cmake --install build --config $env:BUILD_TYPE --component Runtime --prefix $dist
          if ($LASTEXITCODE -ne 0) { throw "Installing Zyron runtime files failed." }
          cmake --install build --config $env:BUILD_TYPE --component bundle --prefix $dist
          if ($LASTEXITCODE -ne 0) { throw "Installing Zyron runtime dependencies failed." }

          $exe = Join-Path $dist "ZyronClient.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Required executable not found: $exe"
          }

          $dlls = @(Get-ChildItem -LiteralPath $dist -Filter "*.dll" -File -Recurse)
          if ($dlls.Count -eq 0) {
            throw "No runtime DLLs were staged under $dist."
          }
          if (-not (Get-ChildItem -LiteralPath $dist -Filter "qwindows.dll" -File -Recurse | Select-Object -First 1)) {
            throw "The Qt Windows platform plugin (qwindows.dll) was not staged."
          }
          Write-Host "Staged $($dlls.Count) runtime DLLs."

          $vcRedist = Join-Path $dist "vc_redist.x64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $vcRedist
          $signature = Get-AuthenticodeSignature -FilePath $vcRedist
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "The downloaded Visual C++ Redistributable does not have a valid Microsoft signature."
          }
          @(
            "Zyron Client Windows x64 runtime"
            ""
            "Run ZyronClient.exe to open the launcher. If Windows reports a missing"
            "Microsoft Visual C++ runtime, install vc_redist.x64.exe once and retry."
            "Minecraft installation and launch require network access and a valid"
            "Microsoft account that owns Minecraft: Java Edition."
          ) | Set-Content -LiteralPath (Join-Path $dist "README.txt") -Encoding utf8

          $process = Start-Process -FilePath $exe -WorkingDirectory $dist -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $process.Refresh()
              if ($process.HasExited) {
                throw "ZyronClient.exe exited during startup with code $($process.ExitCode)."
              }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
                break
              }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)

            $process.Refresh()
            if ($process.HasExited -or $process.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "ZyronClient.exe did not create a main window within 30 seconds."
            }
            Write-Host "Startup smoke test passed; main window title: $($process.MainWindowTitle)"

            $closeRequested = $process.CloseMainWindow()
            if ($closeRequested -and $process.WaitForExit(10000)) {
              Write-Host "ZyronClient.exe closed cleanly after the smoke test."
            } else {
              Write-Warning "ZyronClient.exe remained open after the smoke test; it will be stopped during cleanup."
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE "ZyronClient-Windows-x64-Release.zip"
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "The Zyron release archive was not created."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if (-not ($archive.Entries | Where-Object FullName -EQ "ZyronClient.exe")) {
              throw "The release archive does not contain ZyronClient.exe at its root."
            }
          } finally {
            $archive.Dispose()
          }
      - name: Upload Zyron x64 release artifact
        if: ${{ runner.os == 'Windows' && matrix.artifact-name == 'Windows-MSVC' && env.BUILD_TYPE == 'Release' }}
        uses: actions/upload-artifact@v7
        with:
          name: ZyronClient-Windows-x64-Release-${{ steps.short-version.outputs.version }}
          path: ZyronClient-Windows-x64-Release.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
